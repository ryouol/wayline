[project]
name = "lingbot-map"
version = "0.2.0"
description = "Wayline: private video-to-3D spaces powered by LingBot-Map"
requires-python = ">=3.11,<3.13"
readme = "README.md"
license = "LicenseRef-Wayline-Bundled-Source"
license-files = ["LICENSE.txt", "SAMPLE_LICENSE.md", "THIRD_PARTY_NOTICES.md", "MODEL_PROVENANCE.md", "third_party_licenses/*.txt"]
dependencies = [
    "fastapi==0.141.1",
    "google-auth==2.40.3",
    "modal==1.5.5",
    "opencv-python-headless==4.11.0.86",
    "python-multipart==0.0.32",
    "requests==2.33.0",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
research = [
    "Pillow==12.3.0",
    "einops==0.8.1",
    "huggingface-hub==0.34.4",
    "numpy==1.26.4",
    "safetensors==0.6.2",
    "scipy==1.16.1",
    "tqdm==4.67.1",
]
vis = [
    "matplotlib==3.8.4",
    "onnxruntime==1.22.1",
    "requests==2.33.0",
    "trimesh==4.8.1",
    "viser==0.2.23",
]
demo = ["lingbot-map[research,vis]"]
dev = [
    "httpx2==2.12.0",
    "modal==1.5.5",
    "mypy==1.19.1",
    "pytest==9.0.3",
    "ruff==0.14.13",
    "setuptools==83.0.0",
    "types-requests==2.32.4.20250913",
    "wheel==0.46.3",
]

[project.scripts]
wayline = "lingbot_map.workspace.app:main"
lingbot-workspace = "lingbot_map.workspace.app:main"

[build-system]
requires = ["setuptools==83.0.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lingbot_map*"]

[tool.setuptools.package-data]
"lingbot_map.workspace" = ["static/*", "static/icons/*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["example", "demo_render"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["benchmark/"]
