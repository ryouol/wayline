name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/dev.lock
            requirements/modal.lock

      - name: Set up locked dependency tooling
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.8"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: |
          uv lock --check
          python -m pip install --require-hashes -r requirements/dev.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Verify Linux Modal dependency closure and hashes
        run: python -m pip install --dry-run --ignore-installed --require-hashes -r requirements/modal.lock

      - name: Install recovery encryption runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends age

      - name: Test
        run: python -m pytest

      - name: Lint and type-check
        run: |
          ruff check .
          ruff check lingbot_map/workspace lingbot_map/checkpoints.py tests modal_app.py webui/server.py --select E,F,I,B,UP,SIM
          ruff format --check lingbot_map/workspace lingbot_map/checkpoints.py tests modal_app.py
          mypy lingbot_map/workspace lingbot_map/checkpoints.py

      - name: Check scripts and packaging
        run: |
          python - <<'PY'
          import sys
          from lingbot_map.workspace.app import create_app
          assert "modal_app" not in sys.modules
          assert "modal" not in sys.modules
          PY
          node --check lingbot_map/workspace/static/app.js
          node --check lingbot_map/workspace/static/session-events.js
          node --check lingbot_map/workspace/static/viewer.js
          node --check lingbot_map/workspace/static/share.js
          node --check lingbot_map/workspace/static/timeline.js
          node tests/session-events.test.js
          node tests/inventory-selection.test.js
          node tests/viewer-lifecycle.test.js
          node tests/viewer-trace.test.js
          node tests/timeline.test.js
          bash -n download_weights.sh demo_render/process_videos.sh
          python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist
          python - <<'PY'
          import pathlib, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {
              "lingbot_map/workspace/static/index.html",
              "lingbot_map/workspace/static/app.js",
              "lingbot_map/workspace/static/session-events.js",
              "lingbot_map/workspace/static/viewer.js",
              "lingbot_map/workspace/static/timeline.js",
              "lingbot_map/workspace/static/styles.css",
          }
          missing = required - names
          if missing:
              raise SystemExit(f"wheel is missing packaged UI files: {sorted(missing)}")
          for suffix in ("LICENSE.txt", "SAMPLE_LICENSE.md", "THIRD_PARTY_NOTICES.md"):
              if not any(name.endswith(suffix) for name in names):
                  raise SystemExit(f"wheel is missing {suffix}")
          PY

      - name: Upload wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lingbot-map-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

      - name: Verify production container
        run: |
          docker build -t wayline:ci .
          python scripts/smoke_container.py --image wayline:ci
